<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>人物記事の確認</title><link rel="stylesheet" href="style.css?v=5"><script src="review.js?v=5" defer></script>
</head>
<body>
<header><a href="#" id="home"><span class="brand">人物記事レビュー</span><small>ご本人確認用</small></a><div class="header-actions"><button id="share" type="button" hidden>共有リンクをコピー</button><button id="all" type="button" hidden>コメント一覧</button></div></header>
<div id="access" role="status">記事を読み込んでいます。</div>
<div class="layout" id="layout" hidden>
<nav aria-label="目次">
<strong>目次</strong>
<a href="#overview">概要</a><a href="#career">経歴</a><a href="#person">人物</a><a href="#books">著書</a><a href="#appearances">出演</a><a href="#lectures">主な講演会</a><a href="#external">外部リンク</a>
</nav>
<main>
<h1 id="intro">山本大平</h1>
<div class="tabs"><span aria-current="page">記事</span><button id="discuss" type="button">コメント</button></div>
<p class="guide">修正したい段落や項目をクリックすると、コメント欄が開きます。文章を選択すると、その範囲を指定できます。<span id="sync" role="status"></span></p>
<article aria-label="山本大平の記事案"></article>
</main>
</div>
<aside id="panel" hidden aria-labelledby="panel-title">
<div class="panel-head"><h2 id="panel-title">コメント</h2><button id="close" type="button" aria-label="閉じる">×</button></div>
<blockquote id="quote" hidden></blockquote>
<form id="form" hidden><label for="message">修正内容</label><textarea id="message" rows="5" maxlength="4000" required placeholder="正しい表記や、追記したい内容をご記入ください。"></textarea><button class="primary" type="submit">コメントを保存</button></form>
<p id="status" role="status"></p><div id="comments"></div>
</aside>
</body></html>
